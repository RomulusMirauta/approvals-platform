name: Preview E2E

# Every pull request gets a Vercel preview deployment on the Neon `dev` database branch. When it is ready,
# the Playwright suite runs against that deployed preview: the same build, runtime and database engine as
# production, without touching production. Merging to main deploys to production.
on:
  deployment_status:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end tests on the preview deployment
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm run build:contracts
      - run: npm run e2e -w @approvals/e2e
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-playwright-report
          path: e2e/playwright-report
          retention-days: 7
