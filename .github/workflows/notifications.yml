name: Notification worker

# The live demo runs on Vercel, which only hosts request handlers, not long-running processes.
# This job is the notification service's deployment there: every 5 minutes it drains the outbox
# in the production database and exits. Locally or on a VM it runs as `npm run worker` instead.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-worker
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Forks and fresh clones have no production database: skip instead of failing every 5 minutes.
    if: ${{ vars.WORKER_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:contracts
      - run: npm run drain -w @approvals/notifications
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Optional: without this secret it is empty and the worker reports nothing to Sentry.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Optional: the receiver of every event (e.g. the ERP) and the key the deliveries are signed with.
          # Without the URL no webhook is called; without the secret the deliveries go out unsigned.
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          WEBHOOK_SIGNING_SECRET: ${{ secrets.WEBHOOK_SIGNING_SECRET }}
          # The Sentry environment of the worker's events (the API takes it from VERCEL_ENV).
          NODE_ENV: production
