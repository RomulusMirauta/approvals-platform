# The dashboard and the API on one origin, like vercel.json does in production: static files from the build,
# API paths proxied to the api service, so the browser needs no CORS and the dashboard keeps relative URLs.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # API: the versioned routes, the OpenAPI docs and the health checks.
    location ~ ^/(v1|docs|health|ready)(/|$) {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The API runs with TRUST_PROXY=true, so the login rate limit sees the client, not nginx.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset's name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html. Same security headers as vercel.json sets on the dashboard.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Cross-Origin-Opener-Policy "same-origin";
        try_files $uri /index.html;
    }
}
