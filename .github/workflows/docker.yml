name: Docker

# Builds the images and runs the whole system with Docker Compose (Postgres, migrations and seed, API,
# notification worker, dashboard behind nginx), then walks one approval through it: docker/smoke.sh.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - run: docker/smoke.sh http://localhost:8080
      # nginx must find the api again after it is recreated with a new address (it used to answer 502 for good).
      - name: The dashboard reaches a recreated api
        run: |
          docker compose up -d --wait --wait-timeout 60 --force-recreate --no-deps api
          curl -fsS --retry 15 --retry-all-errors --retry-delay 2 http://localhost:8080/ready
          docker compose up -d --wait --wait-timeout 60 web
      - run: docker compose ps -a
        if: always()
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
