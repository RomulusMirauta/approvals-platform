# The whole system as separate services: docker compose up --build, then open http://localhost:8080.
#
#   db       Postgres
#   migrate  one-shot: applies the Drizzle migrations, then adds the demo data if it isn't there yet
#   api      Fastify REST API (/v1, /docs, /health, /ready)
#   worker   notification service: drains the transactional outbox the API writes to
#   web      the dashboard (nginx), proxying the API paths to api, so the browser sees one origin
#
# DEV-ONLY DEFAULTS: the secrets below are public (they are in this file) and only fit a local machine.
# Override them from the environment or an .env file (JWT_SECRET=..., POSTGRES_PASSWORD=...) anywhere else.
name: approvals-platform

x-api-image: &api-image
  build:
    context: .
    target: api
  image: approvals-platform/api:local

x-database-url: &database-url postgres://approvals:${POSTGRES_PASSWORD:-dev-only-postgres-password}@db:5432/approvals

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: approvals
      POSTGRES_DB: approvals
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-postgres-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U approvals -d approvals']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *api-image
    command: ['node', 'dist/db/seed.js']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *api-image
    init: true
    environment:
      DATABASE_URL: *database-url
      # Dev-only default (public). At least 32 random characters in any real deployment.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-for-docker-compose-not-for-production}
      # nginx in the web service sets X-Forwarded-For.
      TRUST_PROXY: 'true'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    image: approvals-platform/worker:local
    init: true
    environment:
      DATABASE_URL: *database-url
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NOTIFY_WEBHOOK_URL: ${NOTIFY_WEBHOOK_URL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    image: approvals-platform/web:local
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
