# The dashboard and the API on one origin, like vercel.json does in production: static files from the build,
# API paths proxied to the api service, so the browser needs no CORS and the dashboard keeps relative URLs.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Docker's DNS, asked again every 10 s: with a fixed "proxy_pass http://api:3000" nginx resolved api once at
    # startup and answered 502 for good after the api container was recreated with a new address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API: the versioned routes, the OpenAPI docs and the health checks.
    location ~ ^/(v1|docs|health|ready)(/|$) {
        # A variable makes nginx resolve the name per request (through the resolver above). With no URI part,
        # the request's URI is passed on unchanged, query string included.
        set $api http://api:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Replaced, not appended to: the API trusts this header from nginx (TRUST_PROXY in compose.yaml) for the
        # login rate limit. $proxy_add_x_forwarded_for kept whatever the client sent in front, and the API reads the
        # left-most entry, so a client could pick a new IP for every login attempt and never be limited.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite puts a content hash in every asset's name, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html. Same security headers as vercel.json sets on the dashboard.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";
        add_header Cross-Origin-Opener-Policy "same-origin";
        try_files $uri /index.html;
    }
}
